services:
    basicfitnessapp:
        build: .

        container_name: basicfitnessapp
        ports:
            - "8080:8080"

        depends_on:
            postgres:
                condition: service_healthy

        environment:
          OpenAi__ApiKey: ${OPENAI_API_KEY}
          Jwt__Key: ${JWT_KEY}
          Jwt__Issuer: ${JWT_ISSUER}
          Jwt__Audience: ${JWT_AUDIENCE}
          Jwt__ExpirationMinutes: ${JWT_EXPIRATION_MINUTES}
          ConnectionStrings__DefaultConnection: Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}

    postgres:
        image: postgres:17

        container_name: basicfitnessapp_postgres
        
        restart: unless-stopped

        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        
        environment:
          POSTGRES_DB: ${DB_NAME}
          POSTGRES_USER: ${DB_USER}
          POSTGRES_PASSWORD: ${DB_PASSWORD}

        ports:
            - "5432:5432"
        
        volumes:
            - postgres_data:/var/lib/postgresql/data
    
volumes:
    postgres_data: